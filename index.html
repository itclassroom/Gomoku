<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3e6cf" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>五子棋</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23e4bc73'/%3E%3Ccircle cx='12' cy='16' r='6.2' fill='%23131313'/%3E%3Ccircle cx='21' cy='16' r='6.2' fill='%23fffdf8' stroke='%23d9d3c8'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="app">
      <header class="top">
        <div class="masthead">
          <img class="site-logo" src="logo.png" alt="聖愛德華天主教小學" />
          <div class="turn" id="turn">
            <span class="mini black" id="turn-stone" aria-hidden="true"></span>
            <span id="turn-text">黑棋落子</span>
          </div>
        </div>
        <p class="sub">WePlay 棋思妙想五子棋</p>
      </header>

      <div class="board-wrap">
        <div
          id="board"
          class="board"
          role="grid"
          tabindex="0"
          aria-label="五子棋棋盤"
          aria-describedby="board-help"
          aria-rowcount="15"
          aria-colcount="15"
        ></div>
      </div>

      <section class="dock" aria-label="對局控制">
        <p id="status" class="status" aria-live="polite">黑先，點交叉點落子</p>
        <div class="scores">
          <span class="score"><i class="mini black" aria-hidden="true"></i><b id="score-black">0</b></span>
          <span class="score"><i class="mini white" aria-hidden="true"></i><b id="score-white">0</b></span>
          <span class="score">和 <b id="score-draw">0</b></span>
          <button type="button" id="clear-score" class="text-btn">清空比分</button>
        </div>
        <div class="seg" role="group" aria-label="對戰模式">
          <button type="button" id="mode-pvp" aria-pressed="true">雙人</button>
          <button type="button" id="mode-ai" aria-pressed="false">對電腦</button>
        </div>
        <div class="seg" id="color-seg" role="group" aria-label="執子顏色" hidden>
          <button type="button" id="color-black" aria-pressed="true">我執黑</button>
          <button type="button" id="color-white" aria-pressed="false">我執白</button>
        </div>
        <div class="actions">
          <button type="button" id="undo" aria-label="悔棋">悔棋</button>
          <button type="button" id="restart" class="primary" aria-label="重新開始">新局</button>
          <button type="button" id="sound" aria-pressed="true" aria-label="聲音">聲音</button>
        </div>
      </section>
    </div>

    <p id="board-help" class="sr-only">點交叉點落子。使用鍵盤時，方向鍵移動，Enter 落子。</p>

    <div id="loupe" class="loupe" hidden aria-hidden="true">
      <span id="loupe-stone"></span>
      <b id="loupe-label"></b>
    </div>

    <dialog id="result" aria-labelledby="result-title">
      <form method="dialog">
        <div id="result-mark" class="result-mark" aria-hidden="true"></div>
        <p class="eyebrow">對局結束</p>
        <h2 id="result-title"></h2>
        <p id="result-detail"></p>
        <div class="dialog-actions">
          <button type="submit" class="btn" value="close">查看棋盤</button>
          <button type="submit" class="btn primary" value="again">再來一局</button>
        </div>
      </form>
    </dialog>

    <dialog id="confirm" aria-labelledby="confirm-title">
      <form method="dialog">
        <h2 id="confirm-title"></h2>
        <p id="confirm-text"></p>
        <div class="dialog-actions">
          <button type="submit" class="btn" value="cancel">取消</button>
          <button type="submit" class="btn primary" value="ok">確定</button>
        </div>
      </form>
    </dialog>

    <script src="js/engine.js"></script>
    <script src="js/ui.js"></script>
  </body>
</html>
